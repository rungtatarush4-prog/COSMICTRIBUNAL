<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080B12">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>The Cosmic Tribunal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="A grand-strategy governance game: preside over the Cosmic Tribunal, govern the Cosmos and shape the future of civilisations.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: a fixed command rail on the left, a sticky operations bar, and screens built from gold-framed glass plates over a living starfield. Single dark world by design. */
:root{
  --obsidian:#080B12; --navy:#10182D; --navy2:#152040; --navy3:#1D2B52;
  --gold:#D4AF37; --champ:#F1DCA0; --blue:#4776E6; --purple:#7048C8; --pearl:#F5F3EE;
  --text:#ECE7DA; --muted:#AFAA9C; --faint:#7C8196;
  --line:rgba(212,175,55,.30); --line2:rgba(241,220,160,.12); --line3:rgba(241,220,160,.06);
  --glass:rgba(14,21,40,.78); --glass2:rgba(21,32,64,.86); --glass3:rgba(8,11,18,.6);
  --good:#62C893; --warn:#E9AE45; --bad:#E5705F; --info:#7FA3F5;
  --f-display:'Cormorant Garamond', 'Cormorant', 'Iowan Old Style', Georgia, serif;
  --f-body:'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
  --f-mono:'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --fs:14.5px; --rail:244px;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--obsidian);color:var(--text);font-family:var(--f-body);font-size:var(--fs);line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.big{--fs:16.5px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--obsidian)}
#starfield{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
a{color:var(--champ)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--champ);outline-offset:2px}
::selection{background:rgba(212,175,55,.35)}
.mono{font-family:var(--f-mono);font-size:.86em;letter-spacing:.02em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .faint{color:var(--faint)} .good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)} .goldt{color:var(--champ)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- App frame ---------- */
#app{position:relative;z-index:1;display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:100%}
#rail{position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto;background:linear-gradient(180deg,rgba(8,11,18,.94),rgba(16,24,45,.94));border-right:1px solid var(--line);padding:18px 0 24px;padding-left:env(safe-area-inset-left,0px);scrollbar-width:thin}
.brand{display:flex;gap:10px;align-items:center;padding:0 18px 16px;border-bottom:1px solid var(--line2);margin-bottom:10px}
.brand svg{flex:none}
.brand b{display:block;font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:.08em;color:var(--champ);line-height:1.05;text-transform:uppercase}
.brand span{font-size:9.5px;letter-spacing:.12em;white-space:nowrap;text-transform:uppercase;color:var(--muted)}
.nav{display:flex;flex-direction:column;padding:0 8px}
.nav-group{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--faint);padding:14px 12px 6px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-left:2px solid transparent;padding:7px 12px;color:var(--muted);cursor:pointer;font-size:13.5px;border-radius:0}
.nav button:hover{color:var(--text);background:rgba(212,175,55,.06)}
.nav button[aria-current="page"]{color:var(--champ);border-left-color:var(--gold);background:linear-gradient(90deg,rgba(212,175,55,.14),transparent)}
.nav .ico{width:18px;height:18px;flex:none;opacity:.85}
.nav .badge{margin-left:auto}
.badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--gold);color:var(--obsidian);font-size:10.5px;font-weight:700;font-variant-numeric:tabular-nums}
.badge.red{background:var(--bad);color:#fff}
#shell{min-width:0;display:flex;flex-direction:column}

/* ---------- Operations bar ---------- */
#opsbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:rgba(8,11,18,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-block:9px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#menuBtn{display:none}
.datebox{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.datebox b{font-family:var(--f-display);font-size:19px;font-weight:600;color:var(--champ);white-space:nowrap}
.datebox span{font-size:11px;color:var(--muted);letter-spacing:.08em}
.timectl{display:flex;align-items:center;border:1px solid var(--line);border-radius:2px;overflow:hidden}
.timectl button{background:transparent;border:0;border-right:1px solid var(--line2);padding:6px 9px;font-size:12px;color:var(--muted);cursor:pointer;line-height:1.1;white-space:nowrap}
.timectl button:last-child{border-right:0}
.timectl button:hover{color:var(--text);background:rgba(212,175,55,.08)}
.timectl button[aria-pressed="true"]{background:var(--gold);color:var(--obsidian);font-weight:600}
.cmdwrap{flex:1 1 280px;min-width:0;position:relative}
.cmdwrap input[type=text]{width:100%;background:var(--glass3);border:1px solid var(--line);border-radius:2px;padding:8px 12px 8px 34px;font-size:13.5px}
.cmdwrap input::placeholder{color:var(--faint)}
.cmdwrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.7}
.opsstats{display:flex;gap:16px;align-items:center}
.opsstat{display:flex;flex-direction:column;line-height:1.1}
.opsstat small{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.opsstat b{font-variant-numeric:tabular-nums;font-weight:600;font-size:14px}
.iconbtn{position:relative;display:grid;place-items:center;width:34px;height:34px;background:transparent;border:1px solid var(--line);border-radius:2px;cursor:pointer;color:var(--champ)}
.iconbtn:hover{background:rgba(212,175,55,.1)}
.iconbtn .badge{position:absolute;top:-6px;right:-6px}

main#main{flex:1;padding-block:22px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.screen{max-width:1420px;margin:0 auto;display:flex;flex-direction:column;gap:18px;animation:fadein .35s ease}
@keyframes fadein{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ---------- Screen headings ---------- */
.shead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid var(--line2)}
.eyebrow{font-size:10.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold)}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:clamp(28px,3.4vw,40px);line-height:1.05;color:var(--pearl)}
h2{font-size:22px;color:var(--champ)}
h3{font-size:18px;color:var(--pearl)}
.shead p{margin:4px 0 0;color:var(--muted);max-width:70ch}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:10px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-side{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.g-list{grid-template-columns:minmax(260px,.9fr) minmax(0,2fr)}

/* ---------- Plates (framed glass panels) ---------- */
.plate{position:relative;background:var(--glass);border:1px solid var(--line2);padding:16px 18px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);min-width:0}
.plate::before,.plate::after{content:"";position:absolute;width:12px;height:12px;border-color:var(--gold);border-style:solid;pointer-events:none}
.plate::before{top:-1px;left:-1px;border-width:1px 0 0 1px}
.plate::after{bottom:-1px;right:-1px;border-width:0 1px 1px 0}
.plate.flat::before,.plate.flat::after{display:none}
.plate.hero{background:linear-gradient(135deg,rgba(29,43,82,.85),rgba(14,21,40,.85) 60%,rgba(112,72,200,.18));border-color:var(--line)}
.ptitle{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.ptitle h2,.ptitle h3{font-size:19px}
.ptitle .k{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--faint)}
.sep{height:1px;background:var(--line2);margin:12px 0;border:0}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:transparent;border:1px solid var(--line);color:var(--champ);padding:7px 13px;border-radius:2px;cursor:pointer;font-size:13px;font-weight:500;line-height:1.2;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:rgba(212,175,55,.12);border-color:var(--gold)}
.btn.primary{background:linear-gradient(180deg,#E2C25A,var(--gold));border-color:var(--gold);color:var(--obsidian);font-weight:600}
.btn.primary:hover{background:linear-gradient(180deg,#EED47A,#DDB945)}
.btn.blue{border-color:rgba(71,118,230,.6);color:#B9CBFA}
.btn.blue:hover{background:rgba(71,118,230,.16)}
.btn.danger{border-color:rgba(229,112,95,.6);color:#F4B3A8}
.btn.danger:hover{background:rgba(229,112,95,.14)}
.btn.ghost{border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--text);border-color:var(--line2)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn[disabled]{opacity:.42;cursor:not-allowed}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- Form controls ---------- */
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
input[type=text],input[type=number],input[type=search],select,textarea{background:var(--glass3);border:1px solid var(--line2);border-radius:2px;padding:7px 10px;font-size:13.5px;color:var(--text);min-width:0;max-width:100%}
textarea{resize:vertical;min-height:80px;line-height:1.5}
input:focus,select:focus,textarea:focus{border-color:var(--gold);outline:none}
select option{background:var(--navy)}
input[type=range]{accent-color:var(--gold);width:100%}
input[type=checkbox]{accent-color:var(--gold);width:16px;height:16px}

/* ---------- Pills, meters, tables ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:2px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line2);color:var(--muted);white-space:nowrap;font-weight:500}
.pill.gold{color:var(--champ);border-color:var(--line)} .pill.good{color:var(--good);border-color:rgba(98,200,147,.4)} .pill.bad{color:var(--bad);border-color:rgba(229,112,95,.45)} .pill.warn{color:var(--warn);border-color:rgba(233,174,69,.45)} .pill.blue{color:#A9BEF7;border-color:rgba(71,118,230,.45)} .pill.purple{color:#C2AEF2;border-color:rgba(112,72,200,.5)}
.pill.solid-bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.meter{height:5px;background:rgba(245,243,238,.08);position:relative;overflow:hidden}
.meter > i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--gold),var(--champ))}
.meter.blue > i{background:linear-gradient(90deg,var(--blue),#8FB0FF)}
.meter.bad > i{background:var(--bad)} .meter.warn > i{background:var(--warn)}
.tablewrap{overflow-x:auto;max-width:100%}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:500;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);padding:8px 10px;border-bottom:1px solid var(--line2);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line3);vertical-align:top}
tr.click{cursor:pointer} tr.click:hover td{background:rgba(212,175,55,.05)}
tr.sel td{background:rgba(212,175,55,.09)}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:minmax(110px,auto) minmax(0,1fr);gap:6px 14px;font-size:13px}
.kv dt{color:var(--faint)} .kv dd{margin:0;min-width:0}
.empty{padding:24px;text-align:center;color:var(--faint);font-style:italic;font-family:var(--f-display);font-size:17px}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line3);min-width:0}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li h4{margin:0 0 2px;font-size:14px;font-weight:600;color:var(--pearl)}
.li p{margin:0;font-size:13px;color:var(--muted)}
.sel-item{background:none;border:0;border-bottom:1px solid var(--line3);text-align:left;width:100%;padding:10px 10px;cursor:pointer;display:flex;flex-direction:column;gap:4px;color:var(--text);border-left:2px solid transparent}
.sel-item:hover{background:rgba(212,175,55,.05)}
.sel-item[aria-current="true"]{border-left-color:var(--gold);background:rgba(212,175,55,.08)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;color:var(--muted);cursor:pointer;font-size:13px}
.tabs button[aria-selected="true"]{color:var(--champ);border-bottom-color:var(--gold)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.effchips{display:flex;gap:5px;flex-wrap:wrap}
.effchips span{font-size:11.5px;padding:1px 7px;border:1px solid rgba(98,200,147,.35);color:var(--good);font-variant-numeric:tabular-nums}
.effchips span.neg{border-color:rgba(229,112,95,.4);color:var(--bad)}

/* ---------- Dashboard ---------- */
.indgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line2);border:1px solid var(--line2)}
.ind{background:rgba(10,15,28,.88);padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.ind small{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.ind b{font-family:var(--f-display);font-size:30px;font-weight:600;line-height:1;font-variant-numeric:lining-nums tabular-nums}
.ind .d{font-size:11.5px;font-variant-numeric:tabular-nums}
.statline{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.statline div{display:flex;flex-direction:column;gap:2px;min-width:0}
.statline small{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.statline b{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--pearl);overflow:hidden;text-overflow:ellipsis}
.briefing{display:flex;gap:16px;align-items:flex-start}
.briefing blockquote{margin:0;font-family:var(--f-display);font-size:19px;line-height:1.45;color:var(--pearl);font-style:italic}
.briefing cite{display:block;margin-top:8px;font-style:normal;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.alert-row{display:flex;gap:10px;align-items:center;padding:9px 12px;border:1px solid rgba(229,112,95,.35);background:rgba(229,112,95,.07);min-width:0}
.stagepips{display:inline-flex;gap:3px}
.stagepips i{width:14px;height:5px;background:rgba(245,243,238,.12)}
.stagepips i.on{background:var(--bad)}

/* ---------- Avatars / sigils ---------- */
.sigil{flex:none;display:block}
.person{display:flex;gap:10px;align-items:center;min-width:0}
.person b{display:block;font-weight:600;color:var(--pearl);font-size:13.5px}
.person small{display:block;color:var(--muted);font-size:12px}
.opinion{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line3)}
.opinion:last-child{border-bottom:0}
.opinion p{margin:2px 0 0;font-size:13px;color:var(--text)}
.opinion .who{font-size:12px;color:var(--champ);font-weight:600}

/* ---------- Chamber ---------- */
.chamber{position:relative;width:100%;aspect-ratio:16/8;max-width:100%;overflow:hidden;border:1px solid var(--line);background:var(--obsidian)}
.chamber canvas{position:absolute;inset:0;width:100%;height:100%}
.chamber .hot{position:absolute;transform:translate(-50%,-50%);background:transparent;border:1px solid transparent;border-radius:50%;cursor:pointer;color:transparent;font-size:0}
.chamber .hot:hover,.chamber .hot:focus-visible{border-color:var(--champ);box-shadow:0 0 18px rgba(241,220,160,.4)}
.chamber .door{border-radius:40% 40% 2px 2px}
.chamber .tag{position:absolute;transform:translate(-50%,0);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--champ);pointer-events:none;text-shadow:0 1px 4px #000;white-space:nowrap}
.stages{display:flex;gap:0;overflow-x:auto;border:1px solid var(--line2)}
.stages div{flex:1 0 96px;padding:8px 8px;font-size:11px;color:var(--faint);border-right:1px solid var(--line3);line-height:1.25}
.stages div:last-child{border-right:0}
.stages div b{display:block;font-family:var(--f-mono);font-size:10px;color:var(--faint)}
.stages div.done{color:var(--muted)} .stages div.done b{color:var(--gold)}
.stages div.cur{background:rgba(212,175,55,.12);color:var(--champ)} .stages div.cur b{color:var(--champ)}
.qa{border-left:2px solid var(--line);padding:6px 0 6px 12px;margin:6px 0}
.qa q{display:block;color:var(--muted);font-style:italic}
.qa q::before,.qa q::after{content:none}

/* ---------- Map ---------- */
.mapwrap{position:relative;height:min(70vh,640px);min-height:380px;border:1px solid var(--line);overflow:hidden;background:#05070d;touch-action:none}
.mapwrap canvas{position:absolute;inset:0;width:100%;height:100%;cursor:grab}
.mapwrap canvas.drag{cursor:grabbing}
.mapctl{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:4px;z-index:2}
.maplayers{position:absolute;left:10px;bottom:10px;display:flex;gap:6px;flex-wrap:wrap;z-index:2;max-width:calc(100% - 20px)}
.maplayers label{display:flex;gap:5px;align-items:center;font-size:11.5px;background:rgba(8,11,18,.8);border:1px solid var(--line2);padding:3px 8px;cursor:pointer}

/* ---------- Charts ---------- */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--faint);font-size:10.5px;font-family:var(--f-body)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:5px}

/* ---------- Modal, drawer, toasts ---------- */
#modalRoot{position:fixed;inset:0;z-index:80;display:none;align-items:flex-start;justify-content:center;background:rgba(4,6,11,.72);backdrop-filter:blur(3px);overflow-y:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px))}
#modalRoot.open{display:flex}
.modal{position:relative;width:min(760px,100%);background:linear-gradient(180deg,var(--navy2),var(--navy));border:1px solid var(--line);padding:22px 24px;margin:auto 0;box-shadow:0 30px 80px rgba(0,0,0,.6);animation:fadein .25s ease}
.modal.wide{width:min(1000px,100%)}
.modal h2{font-size:26px;color:var(--pearl);margin-bottom:4px}
.modal .x{position:absolute;top:10px;right:10px;z-index:3;background:var(--navy2)}
.modal .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
.preview{border:1px solid var(--line);background:rgba(212,175,55,.06);padding:12px 14px;margin-top:12px}
.preview h4{margin:0 0 6px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);z-index:70;background:linear-gradient(180deg,var(--navy2),var(--obsidian));border-left:1px solid var(--line);transform:translateX(102%);transition:transform .25s ease;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px)}
#drawer.open{transform:none}
#drawer header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line2)}
#drawer .body{overflow-y:auto;padding:4px 16px 24px;flex:1}
.ntf{padding:10px 0;border-bottom:1px solid var(--line3);cursor:pointer;display:flex;gap:10px}
.ntf.unread h4::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--gold);margin-right:7px;vertical-align:middle}
.ntf h4{margin:0;font-size:13px;color:var(--pearl);font-weight:600}
.ntf p{margin:2px 0 0;font-size:12.5px;color:var(--muted);white-space:pre-line}
.ntf .dot{width:3px;flex:none;align-self:stretch;background:var(--line2)}
.ntf.alert .dot{background:var(--bad)} .ntf.success .dot{background:var(--good)} .ntf.brief .dot{background:var(--gold)}
#toasts{position:fixed;bottom:max(16px,env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(560px,calc(100% - 32px));pointer-events:none}
.toast{background:var(--navy2);border:1px solid var(--line);padding:10px 14px;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:fadein .2s ease;pointer-events:auto;max-width:100%}
.toast.bad{border-color:rgba(229,112,95,.6)} .toast.good{border-color:rgba(98,200,147,.5)}

/* ---------- Official documents ---------- */
.doc{margin-top:26px;background:#F7F2E4;color:#1D1A14;padding:34px 38px;border:1px solid #CDB870;box-shadow:inset 0 0 0 6px #F7F2E4,inset 0 0 0 7px #CDB870;font-family:var(--f-display);font-size:17px;line-height:1.55;position:relative}
.doc .dhead{text-align:center;border-bottom:1px solid #CDB870;padding-bottom:14px;margin-bottom:16px}
.doc .dhead small{display:block;font-family:var(--f-body);font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;color:#7A6524}
.doc .dhead h3{font-size:25px;color:#1D1A14;margin:8px 0 4px}
.doc .dref{font-family:var(--f-mono);font-size:11.5px;color:#5E5442}
.doc .dbody{white-space:pre-wrap}
.doc .dsign{display:flex;justify-content:space-between;align-items:flex-end;margin-top:26px;gap:16px;flex-wrap:wrap}
.doc .sigline{border-top:1px solid #1D1A14;padding-top:4px;min-width:200px;font-size:13px;font-family:var(--f-body)}
.doc .sigline i{display:block;font-family:var(--f-display);font-size:24px;font-style:italic;color:#2A3F7A;line-height:1}

/* ---------- Intro ---------- */
#intro{position:fixed;inset:0;z-index:100;background:var(--obsidian);display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:max(20px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));overflow-y:auto}
#intro.open{display:flex}
#intro .chamber{width:min(1100px,100%);border-color:var(--line)}
#intro .welcome{max-width:760px;text-align:center}
#intro .welcome h1{font-size:clamp(30px,5vw,56px);letter-spacing:.06em;text-transform:uppercase;color:var(--champ)}
#intro .welcome .sub{font-family:var(--f-display);font-size:19px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);margin-top:4px}
#intro .welcome p{font-family:var(--f-display);font-size:20px;line-height:1.5;font-style:italic;color:var(--pearl)}
.seal-spin{animation:spin 120s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
body.calm *{animation:none!important;transition:none!important}

/* ---------- Responsive ---------- */
@media (max-width:1180px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.indgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.opsstats .hide-md{display:none}}
@media (max-width:960px){
  #app{grid-template-columns:minmax(0,1fr)}
  #rail{position:fixed;left:0;top:0;bottom:0;z-index:75;width:min(280px,86vw);transform:translateX(-102%);transition:transform .25s ease;padding-top:max(18px,env(safe-area-inset-top,0px))}
  #rail.open{transform:none;box-shadow:20px 0 60px rgba(0,0,0,.6)}
  #menuBtn{display:grid}
  .g-side,.g-list,.g3,.g2{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:640px){
  .hide-sm{display:none}
  .briefing{flex-direction:column;gap:10px}
  .briefing blockquote{font-size:17px}
  .g4{grid-template-columns:minmax(0,1fr)}
  .opsstats{display:none}
  .cmdwrap{order:5;flex-basis:100%}
  .timectl button{padding:6px 7px}
  .doc{padding:22px 18px;font-size:15.5px}
  .modal{padding:18px 16px}
  .kv{grid-template-columns:minmax(0,1fr)}
  .kv dt{margin-top:6px}
}

const fmtUSD = n => (n < 0 ? '−' : '') + '$' + fmt(Math.abs(n)) + 'M';

function staticRng(seed) { let s = seed | 0; return () => { s = (s + 0x6D2B79F5) | 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

function dateParts(day) { const y = Math.floor(day / DAYS_PER_YEAR) + 1; const r = ((day % DAYS_PER_YEAR) + DAYS_PER_YEAR) % DAYS_PER_YEAR; return {y: day < 0 ? 0 : y, m: Math.floor(r / 30), d: r % 30 + 1}; }
function fmtDate(day) { const p = dateParts(day); return `${p.d} ${MONTHS[p.m]}, Year ${p.y} CE`; }

function genericCase(st, title, subject, type, A, B, allegations, laws, crown) {
  const ev = [], titles = ['Sensor records','Financial ledger','Expert assessment','Official correspondence','Satellite survey','Logistics manifest','Internal memorandum'];
  const used = new Set();
  for (let i = 0; i < 4; i++) { let t; do { t = pick(st, titles); } while (used.has(t)); used.add(t); const w = Math.round((rnd(st) * 3 - 1.3) * 2) / 2 || 0.5; ev.push({title:t, desc:w > 0 ? `Supports the claim of ${A.name}.` : `Supports the position of ${B.name}.`, w}); }
  const hw = Math.round((rnd(st) * 4 - 2) * 2) / 2 || 1;
  const hidden = [{title:'Sealed testimony', desc:hw > 0 ? `A confidential source corroborates ${A.name}’s account.` : `A confidential source undermines ${A.name}’s account.`, w:hw}];
  const wq = () => { const w = Math.round((rnd(st) * 2.4 - 1) * 2) / 2; return w; };
  const w1 = wq(), w2 = wq(), w3 = wq(), w4 = wq();
  const total = ev.reduce((s, e) => s + e.w, 0) + hw + w1 + w2 + w3 + w4;
  const truth = clamp(Math.tanh(total / 3) + (rnd(st) - 0.5) * 0.2, -1, 1);
  const Aid = A.id, Bid = B.id;
  const civE = (a, b) => { const o = {}; if (Aid) o[Aid] = a; if (Bid && Bid !== Aid) o[Bid] = b; return o; };
  return {title, subject, type, claimant:{name:A.name, civ:Aid}, respondent:{name:B.name, civ:Bid}, allegations, laws,
    argC:`${A.name} asks the Tribunal to find in its favour and order a remedy.`, argR:`${B.name} denies the allegations and asks for dismissal.`,
    evidence:ev, hidden,
    witnesses:[
      {name:genPerson(st), role:`Official of ${A.name}`, qs:[{q:'What happened, in your own words?', a:w1 >= 0 ? 'Exactly what the claim says. I saw the records myself.' : 'Honestly, the records were less clear than our leaders say.', w:w1}, {q:'Who benefited?', a:w2 >= 0 ? `Only ${B.name}.` : 'Both sides, if I am candid.', w:w2}]},
      {name:genPerson(st), role:crown ? 'Council official' : `Official of ${B.name}`, qs:[{q:'Did your side follow the rules?', a:w3 <= 0 ? 'To the letter. We have the paperwork.' : 'Mostly. There were shortcuts under pressure.', w:w3}, {q:'Were you instructed to act as you did?', a:w4 > 0 ? 'Yes, by my superiors.' : 'No; I acted within my discretion.', w:w4}]}
    ],
    partyQs:{claimant:{q:'What outcome do you seek?', a:'Recognition of the harm and a fair remedy.', w:0.2}, respondent:{q:'Will you accept the Tribunal’s judgment?', a:'We will, though we expect to be vindicated.', w:-0.2}},
    remedies:[
      {key:'full', label:`Full remedy for ${A.name}`, detail:`${B.name} is found fully responsible.`, lean:1, eff:{ind:{}, civ:civE(10, -10)}, crownLoss:crown},
      {key:'partial', label:`Partial remedy for ${A.name}`, detail:'Responsibility is shared, with a proportionate remedy.', lean:0.5, eff:{ind:{trust:0.5}, civ:civE(6, -4)}, crownLoss:crown},
      {key:'settle', label:'Mediated settlement', detail:'Both parties are directed to a settlement under the Tribunal’s supervision.', lean:0, eff:{ind:{trust:1}, civ:civE(2, 2)}},
      {key:'respondent', label:`Find for ${B.name}`, detail:'The claim fails on the evidence.', lean:-0.6, eff:{ind:{}, civ:civE(-8, 6)}},
      {key:'dismiss', label:'Dismiss the claim', detail:'The claim is dismissed without remedy.', lean:-1, eff:{ind:{}, civ:civE(-10, 4)}}
    ], truth, crown:!!crown};
}

/* ---------- GameState construction ---------- */

function applyMode(st, mode) {
  if (mode === 'rise') {
    st.rise = {crowned:false};
    judges(st).forEach((j, i) => { j.trust = 52 + ((i * 7) % 15); });
    st.civs.forEach(c => { if (c.kind !== 'capital') c.rel = Math.max(40, c.rel - 18); });
    Object.assign(st.ind, {approval:62, legitimacy:84, trust:76});
    st.archives = st.archives.filter(a => a.ref !== 'TRB-H-0001');
    archive(st, 'history', 'Candidacy for the Cosmic Throne registered', 'Tarush Rungta has been registered as a candidate for the Cosmic Throne. Recognition requires the endorsement of all Twelve Judges and of the member civilisations.', 'TRB-H-0001');
    st.goal = 'Earn the endorsement of all twelve members of the Tribunal (trust 70+) and of every member civilisation (relation 60+), then petition for recognition from the Private Office.';
  } else if (mode === 'crisis') {
    Object.assign(st.ind, {approval:71, legitimacy:86, trust:68, efficiency:70, stability:58, science:70, environment:55, education:64});
    st.treasury.balance = 18000; st.treasury.reserve = 600;
    const v = st.events.find(e => e.tpl === 'stellar'); v.stage = 2; v.nextEsc = 12;
    [['tidal','thalassine',9], ['shortage','ashen',7], ['storm','korr',11]].forEach(([t, c, n]) => { const e = makeCrisis(st, t, c); e.nextEsc = n; st.events.push(e); });
    st.civs.forEach(c => { if (c.kind === 'member') c.rel = Math.max(35, c.rel - 12); });
    st.goal = 'Bring Cosmic Stability to 80 or higher and resolve every active emergency.';
  } else if (mode === 'tribunal') {
    for (let i = 0; i < 3; i++) st.cases.push(makeCase(st, CASE_TEMPLATES[i % CASE_TEMPLATES.length](st)));
    st.goal = 'Preside over the docket. Keep Judicial Legitimacy above 90 while delivering ten verdicts.';
  } else if (mode === 'creative') {
    st.goal = 'Creative Mode: build civilisations, characters and scenarios freely. Achievements are disabled for this campaign.';
  } else st.goal = 'Govern the Cosmos wisely. There is no final victory, only the record you leave.';
}

/* ---------- Effects ---------- */
function applyEff(st, eff, memo = 'Effect', cat = 'other') {
  if (!eff) return;
  if (eff.ind) for (const k in eff.ind) adjInd(st, k, eff.ind[k]);
  if (eff.civ) for (const k in eff.civ) { const c = civById(st, k); if (c) c.rel = clamp(c.rel + eff.civ[k], 0, 100); }
  if (eff.char) for (const k in eff.char) { const c = charById(st, k); if (c) c.trust = clamp(c.trust + eff.char[k], 0, 100); }
  if (eff.cc > 0) earn(st, eff.cc, cat, memo);
  if (eff.cc < 0) spend(st, -eff.cc, cat, memo);
}
function describeEff(st, eff, cost) {
  const out = [];
  if (cost) out.push({t:`Treasury −${fmt(cost)}M`, neg:true});
  if (!eff) return out;
  if (eff.cc) out.push({t:`Treasury ${eff.cc > 0 ? '+' : '−'}${fmt(Math.abs(eff.cc))}M`, neg:eff.cc < 0});
  if (eff.ind) for (const k in eff.ind) if (eff.ind[k]) out.push({t:`${IND_SHORT[k] || k} ${sgn(eff.ind[k])}`, neg:eff.ind[k] < 0});
  if (eff.civ) for (const k in eff.civ) if (eff.civ[k]) out.push({t:`${civName(st, k)} ${sgn(eff.civ[k])}`, neg:eff.civ[k] < 0});
  if (eff.char) for (const k in eff.char) { const c = charById(st, k); if (c && eff.char[k]) out.push({t:`${c.name} trust ${sgn(eff.char[k])}`, neg:eff.char[k] < 0}); }
  return out;
}
function scaleEff(eff, f) { const e = deep(eff || {}); ['ind','civ','char'].forEach(g => { if (e[g]) for (const k in e[g]) e[g][k] = Math.round(e[g][k] * f * 10) / 10; }); if (e.cc) e.cc = Math.round(e.cc * f); return e; }

/* ---------- Treasury (EconomyEngine core) ---------- */
function ledger(st, type, cat, amount, memo, acct = 'general') {
  const T = st.treasury; const id = nid(st, 'TXN');
  T.ledger.unshift({id, day:st.day, type, cat, amount:Math.round(amount * 100) / 100, memo, acct, balance:Math.round(T.balance)});
  if (T.ledger.length > 500) T.ledger.length = 500;
  const bucket = type === 'revenue' ? T.month.rev : type === 'expense' ? T.month.exp : null;
  if (bucket) bucket[cat] = (bucket[cat] || 0) + amount;
}
function validAmount(a) { return typeof a === 'number' && Number.isFinite(a) && a > 0 && a < 1e9; }
function spend(st, amount, cat, memo, opt = {}) {
  amount = Math.round(Number(amount) * 100) / 100;
  if (!validAmount(amount)) return {ok:false, msg:'Invalid transaction: amount must be a positive number.'};
  const T = st.treasury;
  const avail = T.balance + (opt.useReserve ? T.reserve : 0);
  if (amount > avail) return {ok:false, msg:`Insufficient funds: ${fmtCC(amount)} required, ${fmtCC(avail)} available${opt.useReserve ? ' including the emergency reserve' : ''}.`};
  let fromReserve = 0;
  if (opt.useReserve) { fromReserve = Math.min(T.reserve, amount); T.reserve -= fromReserve; }
  T.balance -= amount - fromReserve;
  ledger(st, 'expense', cat, amount, memo + (fromReserve ? ` (${fmt(fromReserve)}M from reserve)` : ''), fromReserve ? 'reserve' : 'general');
  return {ok:true};
}
function earn(st, amount, cat, memo) {
  amount = Math.round(Number(amount) * 100) / 100;
  if (!validAmount(amount)) return {ok:false, msg:'Invalid transaction.'};
  st.treasury.balance += amount; ledger(st, 'revenue', cat, amount, memo); return {ok:true};
}
function transferToReserve(st, amount) {
  amount = Number(amount);
  if (!validAmount(amount)) return {ok:false, msg:'Enter a positive amount.'};
  if (amount > st.treasury.balance) return {ok:false, msg:`Insufficient funds: only ${fmtCC(st.treasury.balance)} available.`};
  st.treasury.balance -= amount; st.treasury.reserve += amount; ledger(st, 'transfer', 'emergency', amount, 'Allocation to emergency reserve');
  return {ok:true, msg:`${fmtCC(amount)} moved to the emergency reserve.`};
}
function setBudget(st, key, value) {
  const v = Number(value);
  if (!BUDGET_CATS.find(b => b.key === key)) return {ok:false, msg:'Unknown budget category.'};
  if (!Number.isFinite(v) || v < 0 || v > 20000) return {ok:false, msg:'Budget allocations must be between 0 and 20,000.'};
  st.treasury.budget[key] = Math.round(v); return {ok:true};
}
function budgetTotal(st) { return Object.values(st.treasury.budget).reduce((a, b) => a + b, 0); }
function projectedRevenue(st) {
  let contrib = 0; const levy = lawRevenueMod(st, 'contributions');
  st.civs.forEach(c => { if (c.discovered && (c.kind === 'member' || c.kind === 'capital') && c.contribution > 0 && c.rel >= 30) contrib += c.contribution * (0.55 + 0.45 * c.rel / 100) * (0.7 + 0.3 * st.ind.trust / 100) * (1 + levy); });
  const treaties = st.laws.filter(l => l.type === 'treaty' && l.status === 'in force').length;
  return {
    contributions:contrib,
    trade:1200 * (st.ind.trust / 90) * (1 + st.treasury.tradeBonus + treaties * 0.03 + lawRevenueMod(st, 'trade')),
    licensing:Math.max(0, 600 * (st.ind.science / 75) * (1 + lawRevenueMod(st, 'licensing'))),
    infrastructure:600 * (st.ind.stability / 92),
    development:250
  };
}
function lawRevenueMod(st, key) { let m = 0; st.laws.forEach(l => { if (l.status !== 'in force') return; (l.provisions || []).forEach(pk => { const P = PROVISIONS.find(p => p.key === pk); if (P && P.revenue && P.revenue[key]) m += P.revenue[key]; }); }); return m; }
function recurringCosts(st) {
  let laws = 0; st.laws.forEach(l => { if (l.status === 'in force') (l.provisions || []).forEach(pk => { const P = PROVISIONS.find(p => p.key === pk); if (P) laws += P.cost || 0; }); });
  const ped = 1 - 0.1 * st.research.pedagogy;
  const mods = Object.values(st.edu.modules).filter(Boolean).length * 30 * ped;
  const schol = st.edu.scholarships * 0.12 * ped;
  return {laws, edu:mods + schol};
}

/* ---------- Projects (ProjectManager) ---------- */
function createProject(st, spec, o = {}) {
  const cost = Math.round(spec.cost || 0);
  if (spec.req && st.research[spec.req.track] < spec.req.lvl) { const t = RESEARCH_TRACKS.find(x => x.key === spec.req.track); return {ok:false, msg:`Requires ${t.name} level ${spec.req.lvl}.`}; }
  if (spec.key && st.projects.some(p => p.key === spec.key && p.status === 'active')) return {ok:false, msg:`${spec.name} is already under way.`};
  if (cost > 0 && !o.free) { const r = spend(st, cost, spec.cat || 'development', `Project: ${spec.name}`); if (!r.ok) return r; }
  const p = {id:nid(st, 'PRJ'), name:spec.name, cat:spec.cat || 'development', cost, duration:Math.max(1, Math.round(spec.duration || 30)), progress:o.progress || 0, eff:deep(spec.eff || {}), civ:spec.civ || null, special:spec.special || null, inst:spec.inst || null, key:spec.key || null, track:spec.track || null, lvl:spec.lvl || 0, risk:o.risk || null, source:o.source || null, status:'active', started:st.day, desc:spec.desc || ''};
  st.projects.push(p);
  return {ok:true, project:p, msg:`${p.name} begun.`};
}
function projectRate(st) { return (0.55 + 0.45 * st.ind.efficiency / 85) * (1 + 0.06 * st.research.logistics); }
function completeProject(st, p) {
  p.status = 'complete'; p.completed = st.day; p.progress = p.duration;
  applyEff(st, p.eff, `Project ${p.name}`);
  const extra = [];
  switch (p.special) {
    case 'dais': { const i = st.edu.institutions.find(x => x.id === 'inst-dais'); if (i) { i.status = 'Operational pilot'; i.students = 600; } extra.push('DAIS is now an operational COSMOS–EDU pilot institution.'); break; }
    case 'scholar200': st.edu.scholarships += 200; extra.push('200 accessibility scholarships added to COSMOS–EDU.'); break;
    case 'eduinst': { const inst = p.inst || {name:p.name.replace(/^COSMOS–EDU Partner: /, ''), civ:p.civ || 'aurelia'}; st.edu.institutions.push({id:nid(st, 'INS'), name:inst.name, civ:inst.civ, status:'Operational', students:ri(st, 200, 900), since:st.day}); extra.push(`${inst.name} joined COSMOS–EDU.`); break; }
    case 'trade2': st.treasury.tradeBonus += 0.02; extra.push('Trade revenue permanently +2%.'); break;
    case 'fee600': earn(st, 600, 'licensing', 'Verdance Corridor licence fee'); extra.push('Licence fee of CC 600M received.'); break;
    case 'lattice': st.flags.lattice = true; st.events.filter(e => e.status === 'active' && e.tpl === 'stellar').forEach(e => { e.stage = Math.max(1, e.stage - 1); e.nextEsc += 15; }); extra.push('Stellar crises are now easier to contain.'); break;
    case 'research': { st.research[p.track] = Math.max(st.research[p.track], p.lvl); adjInd(st, 'science', 2); if (p.track === 'ecology') adjInd(st, 'environment', 1); if (p.track === 'pedagogy') adjInd(st, 'education', 1); if (p.track === 'logistics') adjInd(st, 'efficiency', 2); extra.push(`${RESEARCH_TRACKS.find(t => t.key === p.track).name} reached level ${p.lvl}.`); break; }
    case 'access': st.edu.institutions.forEach(i => { i.accessible = true; }); extra.push('Every COSMOS–EDU institution is now fully accessible.'); break;
    case 'earthEnv': { const e = civById(st, 'earth'); e.dev.environment = clamp(e.dev.environment + 6, 0, 100); break; }
    case 'earthSci': { const e = civById(st, 'earth'); e.tech = clamp(e.tech + 2, 0, 100); break; }
    case 'fourthDoor': st.flags.fourthDoor = true; extra.push('The Door of Mercy now stands in the Tribunal chamber.'); break;
  }
  if (p.civ) { const c = civById(st, p.civ); if (c) { c.dev.infrastructure = clamp(c.dev.infrastructure + 1, 0, 100); } }
  let riskText = '';
  if (p.risk && rnd(st) < p.risk.chance) { applyEff(st, p.risk.eff, `Complication: ${p.name}`); riskText = ` Complication: ${p.risk.text}`; if (p.source) vindicate(st, p.source, 'bad', p.name); }
  else if (p.source) vindicate(st, p.source, 'good', p.name);
  st.stats.projectsDone++;
  const eff = describeEff(st, p.eff).map(x => x.t).join(', ');

/* ---------- Character intelligence ---------- */
const STYLE_OPEN = {Measured:'Across the long arc of time, ', Guarded:'Look closer before you act. ', Direct:'Plainly: ', Reflective:'Consider what this says about the Crown. ', Fiery:'Enough hesitation. ', Conciliatory:'Let us find the common ground. ', Warm:'Think of the people this touches. ', Precise:'The figures matter here. ', Scholarly:'The evidence suggests a course. ', Lyrical:'The winds carry a clear message. ', Formal:'As a matter of law, ', Composed:'Sovereign, '};
const CHOICE_TEXT = {approve:'I advise approval', conditions:'I advise approval with conditions', reject:'I advise rejection', info:'I advise requesting further information first', tribunal:'I advise referral to the Tribunal', act:'I advise acting now'};
const REASON = {
  approval:['the people will welcome it','it will cost us public confidence'], legitimacy:['it strengthens the Tribunal’s standing','it undermines the Tribunal’s standing'], trust:['it builds trust between civilisations','it will strain trust between civilisations'],
  efficiency:['it makes the Council more effective','it burdens the Council'], stability:['it keeps the Cosmos stable','it puts stability at risk'], science:['it advances knowledge','it sets back research'],
  environment:['it heals living worlds','it harms living worlds'], education:['it widens access to learning','it narrows access to learning'], treasury:['it protects the treasury','the cost is too high for what it buys'],
  risk:['the risks are understood','the risks have not been examined'], rel:['the petitioners deserve the Crown’s support','it would damage relations']

function charScore(ch, eff, cost = 0) {

  if (eff && eff.civ) for (const k in eff.civ) add('rel', (v.trust || 0.25) * eff.civ[k] * 0.1);
  if (cost) add('treasury', -(v.treasury || 0.25) * cost / 400);
  if (eff && eff.cc) add('treasury', (v.treasury || 0.25) * eff.cc / 400);

}
function topReason(parts, positive) {

function petAdvisers(st, p) {
  const byCls = {Environmental:['zephyria','kaelith'], Scientific:['thalor','nyxara'], Constitutional:['aurion','elyndor'], Educational:['solenne','kaelith'], Development:['ignivar','kaelith'], Humanitarian:['solenne','nyxara'], Cultural:['elyndor','vespera'], Administrative:['kaelith','orionis'], Diplomatic:['elyndor','nyxara']};

  const ids = ['arbiter'].concat(byCls[p.cls] || ['vespera','kaelith']).concat([memberByCls[p.cls] || 'esha']);

}
function petAdvice(st, p) {

  const h = p.hidden || {chance:0, eff:{}};
  return petAdvisers(st, p).map(ch => {
    const ap = charScore(ch, p.project.eff, p.cost);
    const sev = Math.max(0.5, -charScore(ch, h.eff).s);
    const riskPen = h.chance * sev * (p.riskRevealed ? 1 : (ch.caution || 1) * 1.4);
    const opts = {
      approve:ap.s - riskPen + urg * 0.3,

    const memo = prior >= 3 && rnd(st) < 0.5 ? ' You have set aside my counsel before; I offer it again regardless.' : '';

}
function remember(st, ch, entry) {

}
function vindicate(st, ref, outcome, what) {
  const lines = [];

    const m = ch.memory.find(x => x.ref === ref); if (!m || m.resolved) return; m.resolved = outcome;
    const cautious = ['reject','info','conditions','tribunal'].includes(m.advice);

    else if (outcome === 'bad' && m.advice === 'approve' && m.followed) lines.push(`${ch.name}: “I supported ${what}. I share responsibility for the complication.”`);
    else if (outcome === 'good' && m.advice === 'reject' && !m.followed) { ch.trust = clamp(ch.trust + 1, 0, 100); lines.push(`${ch.name}: “I advised against ${what}. The outcome proved me wrong, and I say so gladly.”`); }

/* ---------- Petitions (PetitionManager) ---------- */

      if (c) c.rel = clamp(c.rel + (cond ? 2 : 3), 0, 100); adjInd(st, 'approval', 0.4);

/* ---------- Tribunal (TribunalManager) ---------- */
const CASE_STAGES = ['Case registration','Preliminary review','Opening statements','Evidence presentation','Witness examination','Judicial deliberation','Verdict','Implementation','Appeal or constitutional review'];

  if (c.stage === 5) caseDeliberate(st, c);
  c.log.push(`${fmtDate(st.day)}: Stage ${c.stage + 1}: ${CASE_STAGES[c.stage]}.`);
  return {ok:true, msg:`${c.id}: ${CASE_STAGES[c.stage]}.`};
}

  const isParty = key === 'claimant' || key === 'respondent';
  if (isParty && c.stage < 2) return {ok:false, msg:'Parties may be questioned from the opening statements onward.'};
  if (!isParty && c.stage < 4) return {ok:false, msg:'Witnesses are examined at the witness examination stage.'};
  if (c.stage > 5) return {ok:false, msg:'Questioning has closed.'};

}
function caseRequestEvidence(st, id) {

}

  archive(st, 'verdict', `Verdict: ${c.title}`, body, c.id);
  makeDoc(st, 'verdict', `Tribunal Verdict ${c.id}`, verdictDoc(st, c, rem), c.id);
  notify(st, `Verdict delivered in ${c.id}`, `${rem.label}. Judicial Legitimacy ${sgn(legit)}.`, legit < 0 ? 'alert' : 'success', {screen:'tribunal', id:c.id});
  brief(st, legit >= 2 ? `The verdict in ${c.title} has been well received. ${agree} of the Twelve concurred, and the parties regard the process as fair.` : legit >= 0 ? `The verdict in ${c.title} stands, though some observers question parts of the reasoning.` : `The verdict in ${c.title} is being questioned across the Cosmos. ${notes[0] || 'Several judges believe the evidence pointed elsewhere.'}`);

}
function verdictDoc(st, c, rem) {

function enactLaw(st, o) {

function lawDoc(st, law) {

function repealLaw(st, id) {

  const m = charById(st, r.from); let res = {ok:true, msg:''};

  const pendingOld = st.petitions.filter(p => p.status === 'pending' && st.day - p.submitted > 20).length; adjInd(st, 'approval', -0.15 * pendingOld);
  const others = IND_KEYS.filter(k => k !== 'approval').reduce((a, k) => a + st.ind[k], 0) / 7;

  st.civs.forEach(c => { if (c.kind !== 'capital' && c.discovered) c.rel = clamp(c.rel + (65 - c.rel) * 0.01 + (st.ind.trust - 75) / 300, 0, 100); c.pop = Math.round(c.pop * 1.001 * 1000) / 1000; });
  // bookkeeping
  const r = Object.values(T.month.rev).reduce((a, b) => a + b, 0), x = Object.values(T.month.exp).reduce((a, b) => a + b, 0);
  T.hist.push({day:st.day, balance:Math.round(T.balance), revenue:Math.round(r), expense:Math.round(x), reserve:Math.round(T.reserve), rev:deep(T.month.rev), exp:deep(T.month.exp)});
  if (T.hist.length > 120) T.hist.shift();

  ENGINE.monthPassed = true;

/* ---------- Validation of imported saves ---------- */
function validateSave(o) {
  if (!o || typeof o !== 'object') return 'The file is not a campaign save.';
  const req = ['meta','rng','day','ind','treasury','civs','chars','petitions','cases','laws','projects','events','archives'];
  for (const k of req) if (!(k in o)) return `The save is missing “${k}”.`;
  if (o.meta.version > SAVE_VERSION) return 'This save was created by a newer version of the game.';
  if (!Number.isFinite(o.treasury.balance)) return 'The treasury balance in this save is invalid.';
  return null;
}
function migrate(o) {
  const base = newGame(o.meta.mode || 'sandbox', o.meta.seed || 1);
  for (const k in base) if (!(k in o)) o[k] = base[k];
  ['flags','stats','canon','council','edu','earth','rg','research'].forEach(k => { for (const j in base[k]) if (!(j in o[k])) o[k][j] = base[k][j]; });
  return o;
}

/* ---------- Starfield ---------- */
function startStarfield() {
  const cv = document.getElementById('starfield'); const ctx = cv.getContext('2d');
  let W, H, stars = [], motes = [];
  const R = staticRng(7);
  const resize = () => { const dpr = Math.min(2, window.devicePixelRatio || 1); W = cv.width = innerWidth * dpr; H = cv.height = innerHeight * dpr; stars = Array.from({length:Math.round(W * H / 9000)}, () => ({x:R() * W, y:R() * H, r:R() * 1.3 * dpr + 0.2, a:R() * 0.7 + 0.2, t:R() * 6.28, s:R() * 0.02 + 0.004})); motes = Array.from({length:26}, () => ({x:R() * W, y:R() * H, r:(R() * 1.6 + 0.6) * dpr, v:(R() * 0.15 + 0.05) * dpr})); };
  resize(); addEventListener('resize', resize);
  const neb = () => { const g = ctx.createRadialGradient(W * 0.75, H * 0.2, 0, W * 0.75, H * 0.2, W * 0.6); g.addColorStop(0, 'rgba(112,72,200,0.10)'); g.addColorStop(1, 'rgba(8,11,18,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); const g2 = ctx.createRadialGradient(W * 0.15, H * 0.9, 0, W * 0.15, H * 0.9, W * 0.5); g2.addColorStop(0, 'rgba(71,118,230,0.08)'); g2.addColorStop(1, 'rgba(8,11,18,0)'); ctx.fillStyle = g2; ctx.fillRect(0, 0, W, H); };
  const reduced = () => PREFS.calm || matchMedia('(prefers-reduced-motion: reduce)').matches;
  let last = 0;
  const frame = ts => {
    requestAnimationFrame(frame);
    if (ts - last < 50) return; last = ts;
    ctx.fillStyle = '#080B12'; ctx.fillRect(0, 0, W, H); neb();
    const still = reduced();
    stars.forEach(s => { if (!still) s.t += s.s * 3; ctx.globalAlpha = s.a * (0.65 + 0.35 * Math.sin(s.t)); ctx.fillStyle = '#F5F3EE'; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.283); ctx.fill(); });
    ctx.fillStyle = '#F1DCA0';
    motes.forEach(m => { if (!still) { m.y -= m.v; if (m.y < -5) { m.y = H + 5; m.x = Math.random() * W; } } ctx.globalAlpha = 0.25; ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, 6.283); ctx.fill(); });
    ctx.globalAlpha = 1;
  };
  requestAnimationFrame(frame);
}

function sigil(name, hue = 45, size = 40) {
  const r = staticRng(hashStr(name)); const n = 4 + Math.floor(r() * 3); const pts = [];
  for (let i = 0; i < n; i++) { const a = r() * 6.283, d = 6 + r() * 11; pts.push([20 + Math.cos(a) * d, 20 + Math.sin(a) * d]); }
  const lines = pts.slice(1).map((p, i) => `<line x1="${pts[i][0].toFixed(1)}" y1="${pts[i][1].toFixed(1)}" x2="${p[0].toFixed(1)}" y2="${p[1].toFixed(1)}"/>`).join('');
  const id = 'sg' + hashStr(name + size);
  return `<svg class="sigil" width="${size}" height="${size}" viewBox="0 0 40 40" aria-hidden="true"><defs><radialGradient id="${id}" cx="35%" cy="30%"><stop offset="0" stop-color="hsl(${hue} 55% 38%)"/><stop offset="1" stop-color="hsl(${hue} 50% 12%)"/></radialGradient></defs><circle cx="20" cy="20" r="19" fill="url(#${id})" stroke="#D4AF37" stroke-width="1"/><g stroke="hsl(${hue} 70% 80%)" stroke-opacity=".5" stroke-width=".6">${lines}</g>${pts.map(p => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="1.1" fill="#F5F3EE"/>`).join('')}<text x="20" y="25.5" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-size="15" font-weight="700" fill="#F1DCA0">${esc(name.replace(/^Prime /, '').charAt(0))}</text></svg>`;
}
function sealSVG(size = 120, spin = false, dark = true) {

  const stars = Array.from({length:12}, (_, i) => { const a = i / 12 * 6.283 - 1.5708; return `<circle cx="${(60 + Math.cos(a) * 41).toFixed(1)}" cy="${(60 + Math.sin(a) * 41).toFixed(1)}" r="1.8" fill="${ink}"/>`; }).join('');
  const id = 'sealpath' + size + (dark ? 'd' : 'l');

  <g class="${spin ? 'seal-spin' : ''}" style="transform-origin:60px 60px"><circle cx="60" cy="60" r="57" fill="none" stroke="${gold}" stroke-width="1.5"/><circle cx="60" cy="60" r="45" fill="none" stroke="${gold}" stroke-width=".8"/>
  <text font-family="Cormorant Garamond, Georgia, serif" font-size="9.2" letter-spacing="2.6" fill="${ink}" font-weight="700"><textPath href="#${id}" startOffset="0">UNITED UNDER THE CROWN · SOVEREIGNTY BEYOND WORLDS ·</textPath></text></g>
  ${stars}<path d="M42 70 L40 52 L49 59 L60 44 L71 59 L80 52 L78 70 Z" fill="none" stroke="${gold}" stroke-width="1.6" stroke-linejoin="round"/><path d="M42 74 H78" stroke="${gold}" stroke-width="1.6"/>
  <circle cx="60" cy="44" r="2.2" fill="${ink}"/><circle cx="40" cy="52" r="1.8" fill="${ink}"/><circle cx="80" cy="52" r="1.8" fill="${ink}"/><circle cx="49" cy="59" r="1.3" fill="${ink}"/><circle cx="71" cy="59" r="1.3" fill="${ink}"/>

/* ---------- Action runner ---------- */
function run(fn, opt = {}) {
  let r;
  try { r = fn(); } catch (e) { console.error(e); toast('Something went wrong: ' + e.message, 'bad'); return; }
  if (r && r.msg && !opt.silent) toast(r.msg, r.ok ? (opt.kind || '') : 'bad');
  if (r && r.ok) { AUDIO.play(opt.sfx || 'click'); autosave(); }
  flushSfx(); render(true);
  return r;
}
function flushSfx() { if (ENGINE.sfx) { AUDIO.play(ENGINE.sfx); ENGINE.sfx = null; } }

/* ---------- Time ---------- */
function setSpeed(s) { UI.speed = s; UI.acc = 0; renderOps(); }
function advanceDays(n) {
  const startDay = ST.day; let stopped = null;
  ENGINE.interrupts = [];
  for (let i = 0; i < n; i++) { stepDay(ST); if (ENGINE.interrupts.length) { stopped = ENGINE.interrupts[0]; break; } }
  ENGINE.interrupts = [];
  flushSfx();
  if (stopped) { UI.speed = 'paused'; showInterrupt(stopped, ST.day - startDay, n); }
  if (ENGINE.monthPassed) { ENGINE.monthPassed = false; autosave(true); } else autosave();
  render(); return stopped;
}
function showInterrupt(it, done, planned) {
  const e = ST.events.find(x => x.id === it.id);
  const title = it.type === 'crisis' ? 'A new emergency' : it.type === 'catastrophe' ? 'Catastrophe' : 'Emergency escalation';
  openModal(`<div class="eyebrow">Time halted${planned > 1 ? ` after ${done} of ${planned} days` : ''}</div><h2>${title}</h2><div class="briefing" style="margin-top:10px">${sigil('Prime Arbiter', 45, 52)}<div><blockquote>${esc(ST.briefing ? ST.briefing.text : (e ? e.desc : ''))}</blockquote><cite>The Prime Arbiter</cite></div></div><div class="foot"><button class="btn ghost" data-act="closeModal">Dismiss</button><button class="btn primary" data-act="go" data-screen="emergency">Open Emergency Operations</button></div>`, {label:title});
  AUDIO.play('alert');
}
let tickTimer = null;
function startClock() {
  let last = performance.now();
  tickTimer = setInterval(() => {
    const now = performance.now(), dt = now - last; last = now;
    if (UI.speed === 'paused' || document.getElementById('modalRoot').classList.contains('open')) return;
    UI.acc += dt; const per = UI.speed === 'fast' ? 140 : 1100;
    let days = 0; while (UI.acc >= per && days < 10) { UI.acc -= per; days++; }
    if (days) advanceDays(days);
  }, 100);
}

/* ---------- Charts (SVG, drawn to one scale) ---------- */
function niceMax(v) { if (v <= 0) return 1; const e = Math.pow(10, Math.floor(Math.log10(v))); const m = v / e; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10) * e; }
function lineChart(series, opt = {}) {
  const W = opt.w || 640, H = opt.h || 200, P = {l:52, r:14, t:12, b:24};
  const all = series.flatMap(s => s.data.map(d => d[1])); const xs = series.flatMap(s => s.data.map(d => d[0]));
  if (!all.length) return '<div class="empty">No data yet. Advance time to build a history.</div>';
  const minV = opt.min !== undefined ? opt.min : Math.min(0, ...all), maxV = opt.max !== undefined ? opt.max : niceMax(Math.max(...all) * 1.05);
  const x0 = Math.min(...xs), x1 = Math.max(...xs, x0 + 1);
  const X = x => P.l + (x - x0) / (x1 - x0) * (W - P.l - P.r), Y = v => H - P.b - (v - minV) / (maxV - minV) * (H - P.t - P.b);
  const ticks = 4; let grid = '';
  for (let i = 0; i <= ticks; i++) { const v = minV + (maxV - minV) * i / ticks; grid += `<line x1="${P.l}" x2="${W - P.r}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="rgba(241,220,160,.08)"/><text x="${P.l - 6}" y="${(Y(v) + 3.5).toFixed(1)}" text-anchor="end">${opt.fmt ? opt.fmt(v) : fmt(v)}</text>`; }
  const xl = [x0, Math.round((x0 + x1) / 2), x1].map(x => `<text x="${X(x).toFixed(1)}" y="${H - 6}" text-anchor="middle">${fmtDateShort(x)}</text>`).join('');
  const paths = series.map(s => { const d = s.data.map((p, i) => `${i ? 'L' : 'M'}${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join(''); const last = s.data[s.data.length - 1];
    const area = s.area ? `<path d="${d}L${X(last[0]).toFixed(1)},${Y(minV).toFixed(1)}L${X(s.data[0][0]).toFixed(1)},${Y(minV).toFixed(1)}Z" fill="${s.color}" fill-opacity=".1"/>` : '';
    return `${area}<path d="${d}" fill="none" stroke="${s.color}" stroke-width="1.8" stroke-linejoin="round"/><circle cx="${X(last[0]).toFixed(1)}" cy="${Y(last[1]).toFixed(1)}" r="3" fill="${s.color}"/>`; }).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.label || 'Chart')}">${grid}${xl}${paths}</svg><div class="legend">${series.map(s => `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>`;
}
function barList(items, opt = {}) {
  const max = Math.max(1, ...items.map(i => i.v));
  return `<div class="stack" style="gap:7px">${items.map(i => `<div><div class="spread" style="font-size:12.5px"><span>${esc(i.label)}</span><span class="num muted">${opt.fmt ? opt.fmt(i.v) : fmt(i.v)}</span></div><div class="meter ${i.cls || ''}"><i style="width:${(i.v / max * 100).toFixed(1)}%"></i></div></div>`).join('')}</div>`;
}
function effChips(st, eff, cost) { const d = describeEff(st, eff, cost); return d.length ? `<div class="effchips">${d.map(x => `<span class="${x.neg ? 'neg' : ''}">${esc(x.t)}</span>`).join('')}</div>` : '<span class="faint" style="font-size:12px">No direct indicator effects</span>'; }
function meter(v, cls = '') { return `<div class="meter ${cls}" role="meter" aria-valuenow="${Math.round(v)}" aria-valuemin="0" aria-valuemax="100"><i style="width:${clamp(v, 0, 100)}%"></i></div>`; }

function intelBriefing() {
  const out = [];

  if (cr) out.push(`<b>Emergency.</b> ${esc(cr.title)} is at stage ${cr.stage}; escalation expected ${cr.nextEsc - ST.day <= 0 ? 'today' : `in ${cr.nextEsc - ST.day} days`}.`);

  if (pp) out.push(`<b>Petitions.</b> ${pendingPetitions().length} awaiting decision. Nearest deadline: ${esc(pp.id)} in ${Math.max(0, pp.deadlineDay - ST.day)} days.`);
  const oc = openCases(); if (oc.length) out.push(`<b>Tribunal.</b> ${oc.length} case${oc.length > 1 ? 's' : ''} before the Tribunal. ${esc(oc[0].id)} is at “${CASE_STAGES[oc[0].stage]}”.`);
  const neg = activeNegs()[0]; if (neg) out.push(`<b>Diplomacy.</b> ${esc(neg.title)}: ${Math.round(neg.progress)}% agreed, round ${neg.round} on ${fmtDateShort(neg.nextRound)}.`);
  const rev = Object.values(projectedRevenue(ST)).reduce((a, b) => a + b, 0), rc = recurringCosts(ST), exp = budgetTotal(ST) + rc.laws + rc.edu;

/* ---------- 2. Tribunal ---------- */
function thronePositions(st) {
  const P = [];
  const order = JUDGES.map(j => j.id).filter(id => id !== 'arbiter');
  const ys = x => 0.64 - 0.2 * Math.sqrt(Math.max(0, 1 - Math.pow((x - 0.5) / 0.43, 2)));
  order.slice(0, 6).forEach((id, i) => { const x = 0.12 + i * 0.056; P.push({id, x, y:ys(x)}); });
  ['arbiter'].concat(order.slice(6)).forEach((id, i) => { const x = 0.60 + i * 0.056; P.push({id, x, y:ys(x)}); });
  return P;
}
function doorPositions(st) {
  const four = st.flags.fourthDoor;
  const base = [{k:'trial', label:'Trial', col:'#4776E6'}, {k:'petition', label:'Petition', col:'#D4AF37'}, {k:'hidden', label:'Hidden Verdict', col:'#7048C8'}];
  if (four) base.push({k:'mercy', label:'Mercy', col:'#7FD6C2'});
  const xs = four ? [0.29, 0.43, 0.57, 0.71] : [0.32, 0.5, 0.68];
  return base.map((d, i) => Object.assign(d, {x:xs[i], y:0.11, w:four ? 0.085 : 0.095, h:0.31}));
}
function chamberHTML(id, interactive = true) {
  const th = thronePositions(ST), doors = doorPositions(ST);
  const hot = interactive ? th.map(t => { const j = charById(ST, t.id); return `<button class="hot" style="left:${(t.x * 100).toFixed(2)}%;top:${((t.y - 0.06) * 100).toFixed(2)}%;width:6.5%;height:16%" data-act="judge" data-id="${t.id}" aria-label="${esc(j.name)}, ${esc(j.juris)}">${esc(j.name)}</button>`; }).join('')
    + doors.map(d => `<button class="hot door" style="left:${(d.x * 100).toFixed(2)}%;top:${((d.y + d.h / 2) * 100).toFixed(2)}%;width:${(d.w * 100).toFixed(2)}%;height:${(d.h * 100).toFixed(2)}%" data-act="door" data-door="${d.k}" aria-label="Door of ${d.label}">${d.label}</button><span class="tag" style="left:${(d.x * 100).toFixed(2)}%;top:${((d.y + d.h + 0.01) * 100).toFixed(2)}%">${d.label}</span>`).join('')
    + `<button class="hot" style="left:50%;top:76%;width:9%;height:20%" data-act="go" data-screen="office" aria-label="The Central Cosmic Throne">Throne</button>` : '';
  return `<div class="chamber" id="${id}"><canvas aria-label="The Cosmic Tribunal chamber: an obsidian floor over a galaxy, twelve floating thrones, the Central Cosmic Throne, and the doors of Trial, Petition and Hidden Verdict" role="img"></canvas>${hot}</div>`;
}

      + plate(`Vacant seats (${vac})`, vac > 0 ? `<p class="muted" style="margin-top:0;font-size:13px">Configurable seats. Appoint a candidate and assign a responsibility.</p><div class="grid g3">${cands.map(c => `<div class="plate flat" style="padding:12px">${person(c, c.role)}<p style="font-size:12.5px;margin:8px 0">${esc(c.ability)}. ${esc(c.personality)}</p><label class="f">Responsibility<input type="text" id="dept-${hashStr(c.name)}" value="${esc(c.role.replace(/ of .*/, '') + ' Office')}"></label><button class="btn sm primary" style="margin-top:8px" data-act="appoint" data-name="${esc(c.name)}">Appoint</button></div>`).join('') || '<div class="empty">No candidates remain.</div>'}</div>` : '<div class="empty">Every seat is filled. Amend the Council structure to add seats.</div>')

    const coms = ST.council.committees.map(c => `<div class="li"><div class="grow"><h4>${esc(c.name)}</h4><p>Mandate: ${esc(c.mandate)} · Members: ${c.members.map(id => esc((charById(ST, id) || {name:id}).name)).join(', ')}</p></div><button class="btn sm danger" data-act="dissolveCommittee" data-id="${c.id}">Dissolve</button></div>`).join('');
    body = `<div class="grid g2">${plate('Departments', `<div class="tablewrap"><table><thead><tr><th>Department</th><th>Head</th></tr></thead><tbody>${deps}</tbody></table></div><div class="sep"></div><h3>Create a department</h3><div class="row" style="margin-top:8px;align-items:flex-end"><label class="f" style="flex:1 1 180px">Name<input type="text" id="newDeptName" placeholder="e.g. Office of Interstellar Health"></label><label class="f" style="flex:1 1 150px">Head<select id="newDeptHead">${ms.map(m => `<option value="${m.id}">${esc(m.name)}</option>`).join('')}</select></label><button class="btn primary" data-act="createDept">Create</button></div><p class="faint" style="font-size:12px">Up to 12 departments improve efficiency. Beyond that, bureaucracy slows the Council.</p>`, {k:`${ST.council.departments.length}`})}
    ${plate('Committees', `${coms || '<div class="empty">No committees.</div>'}<div class="sep"></div><h3>Establish a committee</h3><label class="f" style="margin-top:8px">Name<input type="text" id="comName" placeholder="e.g. Stellar Watch Committee"></label><label class="f" style="margin-top:8px">Mandate<select id="comMandate">${['stellar','environment','tidal','storm','supply','security','coordination'].map(t => `<option>${t}</option>`).join('')}</select></label><div class="chips" style="margin-top:8px">${ms.filter(m => !m.sovereign).map(m => `<label class="pill" style="cursor:pointer;text-transform:none;letter-spacing:0"><input type="checkbox" class="comMember" value="${m.id}" id="cmm-${m.id}"> ${esc(m.name)}</label>`).join('')}</div><button class="btn primary" style="margin-top:10px" data-act="createCommittee">Establish</button><p class="faint" style="font-size:12px">A committee whose mandate matches an emergency adds 8% to response success.</p>`)}</div>`;
  } else if (tab === 'recs') {
    const recs = ST.council.recommendations;

    ${plate('Delegation of authority', `<p class="muted" style="margin-top:0;font-size:13px">A delegate decides Low and Moderate urgency petitions of that class on your behalf, two days after submission, according to their own judgement.</p><div class="tablewrap"><table><tbody>${classes.map(cl => `<tr><td>${cl}</td><td><select data-chg="delegate" data-cls="${cl}" id="del-${cl}" aria-label="Delegate for ${cl}"><option value="">The Sovereign decides</option>${ms.filter(m => !m.sovereign).map(m => `<option value="${m.id}" ${ST.council.delegations[cl] === m.id ? 'selected' : ''}>${esc(m.name)}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div>`)}</div>`;
  }
  return `<div class="screen">${head('Royal Cosmic Council', 'United Under the Crown', 'The administrative and protective institution of the Crown. Members advise, administer and implement lawful decisions, and may respectfully disagree with the Sovereign.', `<button class="btn primary" data-act="meeting">Convene emergency meeting</button>`)}
  <div class="tabs" role="tablist">${tabs.map(([k, l]) => `<button role="tab" aria-selected="${tab === k}" data-act="tab" data-scr="council" data-tab="${k}">${l}</button>`).join('')}</div>${body}</div>`;
};
function meetingModal(ref) {

}

/* ---------- 4. Universe Map ---------- */

function civPanel(c, compact) {

  <div class="btnrow" style="margin-top:12px">${c.kind !== 'capital' ? `<button class="btn sm" data-act="civAct" data-id="${c.id}" data-a="envoy">Send envoy (CC 120M)</button><button class="btn sm" data-act="civAct" data-id="${c.id}" data-a="aid">Aid package (CC 800M)</button><button class="btn sm" data-act="civAct" data-id="${c.id}" data-a="trade">Propose trade talks</button>${c.kind === 'observer' ? `<button class="btn sm primary" data-act="civAct" data-id="${c.id}" data-a="invite">Invite to membership</button>` : ''}` : ''}${compact ? `<button class="btn sm ghost" data-act="openCiv" data-id="${c.id}">Full dossier</button>` : ''}${c.id === 'earth' ? '<button class="btn sm ghost" data-act="go" data-screen="earth">Earth Affairs</button>' : ''}</div>
  ${c.id === 'earth' ? '<p class="faint" style="font-size:12px">Earth is an independent civilisation (Principle 3). The Crown cooperates with Earth; it does not govern it.</p>' : ''}`);
}

/* ---------- 6. Petitions Office ---------- */
SCREENS.petitions = () => {

  ${sel ? petitionView(sel) : plate('', '<div class="empty">Select a petition.</div>')}</div></div>`;
};
function petitionView(p) {
